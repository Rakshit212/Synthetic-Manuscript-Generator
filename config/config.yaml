# Synthetic Manuscript Generator Configuration

# Output Settings
output_path: "data/output"
dataset_splits:
  train: 85
  validation: 10
  test: 5

# Image Dimensions — traditional pothi (palm-leaf) format is landscape
# Multiple sizes for diversity; pipeline picks randomly per image
image_sizes:
  - width: 2400
    height: 900
  - width: 2000
    height: 800
  - width: 2200
    height: 850
  - width: 1800
    height: 700

# Margins
margins:
  top: 60
  bottom: 60
  left: 80
  right: 80

# Script specific settings
scripts:
  devanagari:
    name: "Devanagari"
    enabled: true
    input_file: "data/input/devanagari.txt"
    font_dir: "fonts/devanagari"
    default_font_size: 36
    line_spacing: 1.5
    character_spacing: 8
    default_ink_color: [30, 20, 20]
    ink_colors:
      - [25, 15, 10]    # dark brown-black
      - [40, 25, 15]    # warm dark brown
      - [50, 30, 20]    # medium brown
      - [20, 10, 5]     # near black
      - [120, 30, 20]   # red ink (for section headers)
  modi:
    name: "Modi"
    enabled: true
    input_file: "data/input/modi.txt"
    font_dir: "fonts/modi"
    default_font_size: 38
    line_spacing: 1.5
    character_spacing: 8
    default_ink_color: [30, 20, 20]
    ink_colors:
      - [25, 15, 10]
      - [35, 20, 12]
      - [45, 28, 18]
      - [20, 10, 5]
  sharada:
    name: "Sharada"
    enabled: true
    input_file: "data/input/sharada.txt"
    font_dir: "fonts/sharada"
    default_font_size: 38
    line_spacing: 1.5
    character_spacing: 8
    default_ink_color: [30, 20, 20]
    ink_colors:
      - [25, 15, 10]
      - [35, 20, 12]
      - [45, 28, 18]
      - [20, 10, 5]

# Background generation
background:
  types: ["paper", "palm_leaf"]
  base_colors:
    paper:
      - [240, 230, 210]   # cream
      - [230, 218, 195]   # warm parchment
      - [220, 210, 185]   # aged paper
      - [235, 225, 200]   # light parchment
      - [210, 195, 170]   # darker aged
      - [225, 215, 190]   # medium cream
    palm_leaf:
      - [185, 165, 120]   # classic palm leaf
      - [170, 150, 105]   # darker palm leaf
      - [195, 175, 130]   # lighter palm leaf
      - [160, 140, 100]   # very aged
      - [175, 155, 115]   # medium
  noise_intensity: 0.15
  edge_darkening_intensity: 0.4
  grain_intensity: 0.08
  fiber_count: 40

# Rendering variations (Handwriting effects)
rendering:
  rotation_range: [-1.5, 1.5]       # degrees per line
  slant_range: [-0.04, 0.04]        # horizontal shear
  baseline_variation: 4              # pixels sinusoidal amplitude
  baseline_frequency: 0.02           # frequency of baseline wave
  char_spacing_variation: 2          # pixels
  line_spacing_variation: 8          # pixels
  margin_jitter: 15                  # left margin variation per line
  ink_opacity_range: [210, 255]      # alpha channel range
  font_size_variation: 3             # +/- pixels from default
  fill_page: true                    # repeat text to fill available area

# Effects (Imperfections)
effects:
  ink_bleeding:
    probability: 0.7
    intensity_range: [1.0, 2.5]      # blur radius for bleeding
    localized: true
  smudging:
    probability: 0.4
    intensity: 0.5
    max_smudges: 5
  aging:
    probability: 0.9
    intensity: 0.6
    yellowing: 0.15
    foxing_count: [5, 25]
  stains:
    probability: 0.5
    max_stains: 4
    opacity_range: [20, 80]
  deformation:
    probability: 0.6
    wave_amplitude: [3, 8]
    wave_frequency: [0.005, 0.015]
  noise:
    probability: 0.7
    gaussian_sigma: 1.5
    speckle_density: 0.0003
  edge_damage:
    probability: 0.5
    intensity: 0.3
